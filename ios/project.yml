name: Salino

options:
  bundleIdPrefix: com.salino
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 7.1.0

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: "7BLH4NFZDD"
    MARKETING_VERSION: 1.3.1
    CURRENT_PROJECT_VERSION: 28
    CODE_SIGN_STYLE: Automatic

targets:
  Salino:
    type: application
    platform: iOS
    sources:
      - App
      - UI
      - ViewModels
      - Domain
      - Data
      - Local
      - Remote
      - Services
      - Models
    resources:
      - path: Resources
        excludes:
          - "AppIcon60x60@2x.png"
          - "AppStoreRequiredIcon120.png"
          - "GoogleService-Info.plist.example"
    configFiles:
      Debug: Config/FirebaseSecrets.xcconfig
      Release: Config/FirebaseSecrets.xcconfig
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salino.sali
        # Single processed plist from Resources/Info.plist (GENERATE YES was omitting CFBundleIconName in merged bundle → 90713).
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    # Copy phase alone did not place PNG at .app root in IPA; explicit copy before codesign is reliable.
    postBuildScripts:
      - name: App Store 120px icon at bundle root
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Resources/AppIcon60x60@2x.png"
          test -f "$SRC"
          DEST="${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}"
          if [[ ! -d "${DEST}" ]] && [[ -n "${CODESIGNING_FOLDER_PATH:-}" ]]; then
            DEST="${CODESIGNING_FOLDER_PATH}"
          fi
          cp "$SRC" "${DEST}/AppIcon60x60@2x.png"
          test -f "${DEST}/AppIcon60x60@2x.png"

  SalinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Salino

schemes:
  Salino:
    build:
      targets:
        Salino: all
        SalinoTests: [test]
    test:
      targets:
        - SalinoTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
