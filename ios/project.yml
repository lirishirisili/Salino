name: Salino

options:
  bundleIdPrefix: com.salino
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 7.1.0

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: "7BLH4NFZDD"
    MARKETING_VERSION: 1.3.1
    CURRENT_PROJECT_VERSION: 28
    CODE_SIGN_STYLE: Automatic

targets:
  Salino:
    type: application
    platform: iOS
    sources:
      - App
      - UI
      - ViewModels
      - Domain
      - Data
      - Local
      - Remote
      - Services
      - Models
    resources:
      - Resources
    configFiles:
      Debug: Config/FirebaseSecrets.xcconfig
      Release: Config/FirebaseSecrets.xcconfig
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salino.sali
        # Merge generated keys + Resources/Info.plist so CFBundleIconName reaches the signed bundle (fixes App Store 90713).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: Resources/Info.plist
    # Runs after compile/link/resources, before the final codesign — safe to tweak the .app bundle.
    postBuildScripts:
      - name: App Store CFBundleIconName + 120px PNG (before codesign)
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          APP="${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}"
          PLIST="${APP}/Info.plist"
          test -f "$PLIST"
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST" &>/dev/null; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          fi
          SRC="${SRCROOT}/Resources/AppStoreRequiredIcon120.png"
          test -f "$SRC"
          cp "$SRC" "${APP}/AppStoreRequiredIcon120.png"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST"

  SalinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Salino

schemes:
  Salino:
    build:
      targets:
        Salino: all
        SalinoTests: [test]
    test:
      targets:
        - SalinoTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
