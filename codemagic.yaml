workflows:
  ios-debug-build:
    name: iOS Debug Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_WORKSPACE_DIR: ios
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build unsigned simulator app
        script: |
          cd ios
          xcodebuild build \
            -scheme Salino \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/build/**/*

  ios-testflight-ready:
    name: iOS TestFlight Archive
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      groups:
        - app-store-connect
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up code signing
        script: |
          set -eo pipefail
          keychain initialize
          openssl genrsa -out /tmp/certificate_key.pem 2048
          PROFILES_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          app-store-connect fetch-signing-files "com.salino.sali" \
            --type IOS_APP_STORE \
            --create \
            --profiles-dir "$PROFILES_DIR" \
            --certificate-key "@file:/tmp/certificate_key.pem"
          CERT_DIR="${HOME}/Library/Developer/Xcode/UserData/Certificates"
          P12_FILE=$(find "$CERT_DIR" -maxdepth 1 -name "*.p12" -type f -print0 | xargs -0 ls -t 2>/dev/null | head -1)
          if [ -z "${P12_FILE:-}" ] || [ ! -f "$P12_FILE" ]; then
            echo "ERROR: No .p12 after fetch-signing-files"
            exit 1
          fi
          KEYCHAIN=$(security default-keychain | sed 's/^[[:space:]]*"//;s/"[[:space:]]*$//')
          export PATH="/opt/homebrew/opt/openssl@3/bin:/usr/local/opt/openssl@3/bin:${PATH}"
          OSSL=$(command -v openssl)
          echo "Using openssl: $OSSL ($("$OSSL" version 2>/dev/null || true))"
          import_p12_via_openssl() {
            local p12="$1" kc="$2" tmp err
            tmp=$(mktemp -d)
            err="$tmp/openssl.log"
            : >"$err"
            if ! { "$OSSL" pkcs12 -in "$p12" -nokeys -nodes -passin pass: -out "$tmp/cert.pem" 2>>"$err" \
              || "$OSSL" pkcs12 -legacy -in "$p12" -nokeys -nodes -passin pass: -out "$tmp/cert.pem" 2>>"$err"; }; then
              echo "openssl extract cert failed:"; cat "$err"; rm -rf "$tmp"; return 1
            fi
            if ! { "$OSSL" pkcs12 -in "$p12" -nocerts -nodes -passin pass: -out "$tmp/key.pem" 2>>"$err" \
              || "$OSSL" pkcs12 -legacy -in "$p12" -nocerts -nodes -passin pass: -out "$tmp/key.pem" 2>>"$err"; }; then
              echo "openssl extract key failed:"; cat "$err"; rm -rf "$tmp"; return 1
            fi
            if ! security import "$tmp/cert.pem" -k "$kc" -T /usr/bin/codesign -T /usr/bin/security 2>>"$err"; then
              echo "security import cert:"; cat "$err"; rm -rf "$tmp"; return 1
            fi
            if ! security import "$tmp/key.pem" -k "$kc" -T /usr/bin/codesign -T /usr/bin/security 2>>"$err"; then
              echo "security import key:"; cat "$err"; rm -rf "$tmp"; return 1
            fi
            rm -rf "$tmp"
          }
          echo "Importing distribution p12: $P12_FILE"
          if security import "$P12_FILE" -k "$KEYCHAIN" -P "" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 2>/tmp/p12-import.log; then
            echo "Imported p12 via security import"
          elif import_p12_via_openssl "$P12_FILE" "$KEYCHAIN"; then
            echo "Imported p12 via openssl + security"
          else
            echo "ERROR: certificate import failed. security import log:"; cat /tmp/p12-import.log 2>/dev/null || true
            exit 1
          fi
          PROFILE_PATH=""
          best=0
          while IFS= read -r -d '' f; do
            m=$(stat -f%m "$f" 2>/dev/null || echo 0)
            if [ "$m" -ge "$best" ]; then best=$m; PROFILE_PATH="$f"; fi
          done < <(find "$PROFILES_DIR" -maxdepth 1 -name "*.mobileprovision" -print0)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found!"
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin)
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV
      - name: Archive
        script: |
          cd ios
          xcodebuild archive \
            -project Salino.xcodeproj \
            -scheme Salino \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/Salino.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="7BLH4NFZDD" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>7BLH4NFZDD</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.salino.sali</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/Salino.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
