workflows:
  ios-debug-build:
    name: iOS Debug Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_WORKSPACE_DIR: ios
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build unsigned simulator app
        script: |
          cd ios
          xcodebuild build \
            -scheme Salino \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/build/**/*

  ios-testflight-ready:
    name: iOS TestFlight Archive
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      groups:
        - app-store-connect
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.salino.sali" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          cd ios
          xcode-project use-profiles --project Salino.xcodeproj
      - name: Build IPA
        script: |
          cd ios
          xcode-project build-ipa \
            --project Salino.xcodeproj \
            --scheme Salino
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - "**/Salino*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
