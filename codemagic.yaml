workflows:
  ios-debug-build:
    name: iOS Debug Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_WORKSPACE_DIR: ios
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build unsigned simulator app
        script: |
          cd ios
          xcodebuild build \
            -scheme Salino \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/build/**/*

  ios-testflight-ready:
    name: iOS TestFlight Archive
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      groups:
        - app-store-connect
        # Add this group in Codemagic: App settings → Environment variables → Variable groups.
        # Link Apple Distribution .p12 + App Store provisioning profile for com.salino.sali (Code signing identities).
        - ios-code-signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.salino.sali
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up code signing settings on Xcode project
        script: |
          cd ios
          xcode-project use-profiles --project Salino.xcodeproj --archive-method app-store
      - name: Archive
        script: |
          cd ios
          xcodebuild archive \
            -project Salino.xcodeproj \
            -scheme Salino \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/Salino.xcarchive"
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/Salino.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
