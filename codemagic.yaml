workflows:
  ios-testflight:
    name: iOS — Expo TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      groups:
        # App Store Connect API key (same vars as Aria's `basic` group):
        # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
        - app-store-connect
      vars:
        EXPO_DIR: mobile
        BUNDLE_ID: com.salino.sali
        BUILD_DIR: $CM_BUILD_DIR
        SIMULATOR_DERIVED_DATA: $CM_BUILD_DIR/DerivedDataSimulator
        APPETIZE_ZIP: $CM_BUILD_DIR/Haserli-simulator-appetize.zip
        APP_PREVIEW_DIR: $CM_BUILD_DIR/app-preview
        # Do NOT use `ios_signing` here — profiles are created at build time via
        # App Store Connect API (see .github/scripts/ios-testflight-run.sh), like Aria.
    scripts:
      - name: Run iOS TestFlight pipeline
        script: |
          set -euxo pipefail
          chmod +x .github/scripts/*.sh
          bash .github/scripts/setup-codemagic-cli.sh
          bash .github/scripts/ios-testflight-run.sh
    artifacts:
      - $CM_BUILD_DIR/ios/ipa/*.ipa
      - $CM_BUILD_DIR/Haserli-simulator-appetize.zip
      - $CM_BUILD_DIR/build.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  # Appetize.io requires an iOS *Simulator* build (.app inside a .zip).
  ios-simulator-appetize:
    name: iOS — Simulator (Appetize)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      vars:
        EXPO_DIR: mobile
        BUILD_DIR: $CM_BUILD_DIR
        SIMULATOR_DERIVED_DATA: $CM_BUILD_DIR/DerivedDataSimulator
        APPETIZE_ZIP: $CM_BUILD_DIR/Haserli-simulator-appetize.zip
        APP_PREVIEW_DIR: $CM_BUILD_DIR/app-preview
    scripts:
      - name: Run iOS Simulator (Appetize) pipeline
        script: |
          set -euxo pipefail
          chmod +x .github/scripts/*.sh
          bash .github/scripts/setup-codemagic-cli.sh
          bash .github/scripts/ios-simulator-appetize-run.sh
    artifacts:
      - $CM_BUILD_DIR/Haserli-simulator-appetize.zip

  # Codemagic App Preview → Quick launch needs an unsigned Simulator .app artifact.
  ios-simulator-app-preview:
    name: iOS — Simulator (App Preview)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      vars:
        EXPO_DIR: mobile
        BUILD_DIR: $CM_BUILD_DIR
        SIMULATOR_DERIVED_DATA: $CM_BUILD_DIR/DerivedDataAppPreview
        APP_PREVIEW_DIR: $CM_BUILD_DIR/app-preview
    scripts:
      - name: Install JS dependencies
        script: |
          set -euxo pipefail
          cd "$EXPO_DIR"
          npm ci

      - name: Run expo prebuild for iOS
        script: |
          set -euxo pipefail
          cd "$EXPO_DIR"
          CI=1 npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          set -euxo pipefail
          cd "$EXPO_DIR/ios"
          pod install --repo-update

      - name: Build Simulator .app for App Preview
        script: |
          set -euxo pipefail
          chmod +x .github/scripts/*.sh
          # shellcheck source=ci-env.sh
          source .github/scripts/ci-env.sh
          export CI=1
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE_ABS" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$SIMULATOR_DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

          APP_PATH=$(
            find "$SIMULATOR_DERIVED_DATA/Build/Products" -type d -name "*.app" -path "*iphonesimulator*" \
              | head -1
          )
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find Simulator .app under $SIMULATOR_DERIVED_DATA" >&2
            find "$SIMULATOR_DERIVED_DATA" -name "*.app" >&2 || true
            exit 1
          fi
          if ! find "$APP_PATH" \( -name '*.jsbundle' -o -name '*.hbc' \) -print -quit | grep -q .; then
            echo "ERROR: No embedded JS bundle in $APP_PATH" >&2
            exit 1
          fi
          mkdir -p "$APP_PREVIEW_DIR"
          APP_NAME=$(basename "$APP_PATH")
          rm -rf "$APP_PREVIEW_DIR/$APP_NAME"
          cp -R "$APP_PATH" "$APP_PREVIEW_DIR/"
          ls -la "$APP_PREVIEW_DIR"

    artifacts:
      - $CM_BUILD_DIR/app-preview/**/*.app
      - $SIMULATOR_DERIVED_DATA/Build/Products/**/*-iphonesimulator/*.app
