workflows:
  ios-debug-build:
    name: iOS Debug Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_WORKSPACE_DIR: ios
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build unsigned simulator app
        script: |
          cd ios
          xcodebuild build \
            -scheme Salino \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/build/**/*

  ios-testflight-ready:
    name: iOS TestFlight Archive
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      groups:
        - app-store-connect
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up code signing
        script: |
          set -euo pipefail
          keychain initialize
          # EC P-256 key for Apple distribution CSR; --certificate-key needs @file: (bare path is invalid).
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/certificate_key.pem
          PROFILES_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          app-store-connect fetch-signing-files "com.salino.sali" \
            --type IOS_APP_STORE \
            --create \
            --profiles-dir "$PROFILES_DIR" \
            --certificate-key "@file:/tmp/certificate_key.pem"
          keychain add-certificates
          # Extract provisioning profile info
          PROFILE_PATH=$(find "$PROFILES_DIR" -name "*.mobileprovision" | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found!"
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin)
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV
      - name: Archive
        script: |
          cd ios
          xcodebuild archive \
            -project Salino.xcodeproj \
            -scheme Salino \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/Salino.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="7BLH4NFZDD" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>7BLH4NFZDD</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.salino.sali</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/Salino.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
