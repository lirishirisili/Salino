workflows:
  ios-debug-build:
    name: iOS Debug Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_WORKSPACE_DIR: ios
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build unsigned simulator app
        script: |
          cd ios
          xcodebuild build \
            -scheme Salino \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/build/**/*

  ios-testflight-ready:
    name: iOS TestFlight Archive
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      groups:
        - app-store-connect
        # Add this group in Codemagic: App settings → Environment variables → Variable groups.
        # Link Apple Distribution .p12 + App Store provisioning profile for com.salino.sali (Code signing identities).
        - ios-code-signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.salino.sali
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || true
      - name: Prepare Firebase config
        script: |
          chmod +x ios/Scripts/setup_firebase_config.sh
          ios/Scripts/setup_firebase_config.sh
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up code signing settings on Xcode project
        script: |
          cd ios
          xcode-project use-profiles --project Salino.xcodeproj --archive-method app-store
      - name: Patch Info.plist for App Store validation
        script: |
          chmod +x ios/Scripts/patch_app_store_bundle_plist.sh
          ios/Scripts/patch_app_store_bundle_plist.sh
      - name: Archive
        script: |
          cd ios
          xcodebuild archive \
            -project Salino.xcodeproj \
            -scheme Salino \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/Salino.xcarchive"
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/Salino.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$HOME/export_options.plist"
      - name: Verify code signature before upload
        script: |
          set -euo pipefail
          VDIR="$(mktemp -d /tmp/salino-ipa-verify.XXXXXX)"
          trap 'rm -rf "$VDIR"' EXIT
          unzip -q "$CM_BUILD_DIR/build/ios/ipa/Salino.ipa" -d "$VDIR"
          APP="$(find "$VDIR/Payload" -maxdepth 1 -name '*.app' | head -1)"
          echo "=== CFBundleIconName (must be AppIcon for App Store 90713) ==="
          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist" 2>/dev/null || true)"
          echo "${ICON_NAME:-"(MISSING)"}"
          if [[ "${ICON_NAME:-}" != "AppIcon" ]]; then
            echo "ERROR: Expected CFBundleIconName=AppIcon in signed app Info.plist"
            exit 1
          fi
          echo "=== Loose 120px PNG at .app root (90022 check) ==="
          find "$APP" -maxdepth 1 -name '*.png' -print || true
          if [[ ! -f "$APP/AppIcon60x60@2x.png" ]]; then
            echo "ERROR: Missing AppIcon60x60@2x.png (120x120 legacy-named icon for App Store validation)"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
