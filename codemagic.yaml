workflows:
  ios-testflight:
    name: iOS — Expo TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      groups:
        # Must exist in Codemagic → Teams → Integrations → Environment variables.
        # Provides APP_STORE_CONNECT_PRIVATE_KEY, _KEY_IDENTIFIER, _ISSUER_ID.
        - app-store-connect
        # Provides the signing certificate password (if any) for Codemagic CLI.
        - ios-code-signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.salino.sali
      vars:
        EXPO_DIR: mobile
        # `expo prebuild` derives these from app.json `expo.name` = "Haserli".
        XCODE_PROJECT: mobile/ios/Haserli.xcodeproj
        XCODE_WORKSPACE: mobile/ios/Haserli.xcworkspace
        XCODE_SCHEME: Haserli
        BUNDLE_ID: com.salino.sali
    scripts:
      - name: Install JS dependencies
        script: |
          set -euxo pipefail
          cd "$EXPO_DIR"
          npm ci

      - name: Run expo prebuild for iOS
        # Generates mobile/ios/ from app.json + plugins. `--clean` ensures the
        # build never sees stale state from a previous run on the same machine.
        script: |
          set -euxo pipefail
          cd "$EXPO_DIR"
          CI=1 npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          set -euxo pipefail
          cd "$EXPO_DIR/ios"
          pod install --repo-update

      - name: Set CFBundleVersion to Codemagic build number
        # $BUILD_NUMBER auto-increments across all Codemagic runs of this app,
        # so each upload to App Store Connect gets a unique value (ASC rejects
        # duplicates). The marketing version (CFBundleShortVersionString) stays
        # as defined in mobile/app.json.
        script: |
          set -euxo pipefail
          cd "$EXPO_DIR/ios"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Refresh App ID, purge stale profiles & orphan distribution certs
        # This step makes the iOS pipeline self-healing against two classes
        # of App Store Connect drift that otherwise force manual cleanup in
        # the Apple Developer Portal between builds:
        #
        # (a) Capability drift. Provisioning profiles are a snapshot of the
        #     App ID's capabilities at the moment they were issued. The
        #     first time we add a new entitlement to the app (e.g.
        #     `com.apple.developer.applesignin` from
        #     `expo-apple-authentication` + `usesAppleSignIn: true` in
        #     `app.json`) the previously-issued IOS_APP_STORE profile
        #     becomes stale and the next `xcodebuild archive` fails with
        #     "Provisioning profile <X> doesn't include the Y capability".
        #
        # (b) Certificate quota. Apple caps active Distribution
        #     certificates at 2 per team. Each Codemagic run generates a
        #     fresh 2048-bit RSA private key (we have nowhere to persist
        #     it between ephemeral mac_mini instances without bringing the
        #     user into the loop), which means *no* previously-issued
        #     Distribution certificate ever matches it. As soon as both
        #     slots are full, `fetch-signing-files --create` fails with
        #     HTTP 409 "You already have a current Distribution
        #     certificate". The only certs we can purge here are the ones
        #     whose private key we don't have — which is, by construction,
        #     every existing Distribution certificate.
        #
        # Pipeline:
        #   1. Resolve the Bundle ID resource id (App Store Connect's API
        #      addresses Bundle IDs by an alphanumeric internal id, not by
        #      the dotted "com.foo.bar" string).
        #   2. Enable Sign in with Apple on the App ID (idempotent; the CLI
        #      is tolerant of the capability already being on, but we guard
        #      with `||` so a transient failure can't abort the build).
        #   3. Delete every IOS_APP_STORE provisioning profile bound to
        #      that Bundle ID, so the next `fetch-signing-files --create`
        #      regenerates one matching the *current* capability set.
        #   4. Revoke every DISTRIBUTION / IOS_DISTRIBUTION certificate so
        #      the next `fetch-signing-files --create` is guaranteed to be
        #      under Apple's quota.
        #
        # SAFETY: revoking a Distribution certificate disables further
        # *signing* with that key, but it does NOT invalidate binaries
        # already uploaded to TestFlight or the App Store — existing
        # installs keep working. Use this workflow as the only producer of
        # iOS App Store builds for this Bundle ID.
        #
        # If you add another capability via an Expo plugin in the future
        # (Push Notifications, Associated Domains, ...), just add another
        # `--capability` line below — `jq` and the Codemagic CLI are
        # preinstalled on the macOS image so no extra setup is required.
        script: |
          set -euxo pipefail

          BUNDLE_ID_RESOURCE=$(
            app-store-connect bundle-ids list \
              --bundle-id-identifier "$BUNDLE_ID" \
              --strict-match-identifier \
              --json \
            | jq -r '.[0].id'
          )

          if [ -z "$BUNDLE_ID_RESOURCE" ] || [ "$BUNDLE_ID_RESOURCE" = "null" ]; then
            echo "ERROR: could not resolve Bundle ID resource for $BUNDLE_ID" >&2
            exit 1
          fi
          echo "Resolved Bundle ID resource: $BUNDLE_ID_RESOURCE"

          app-store-connect bundle-ids enable-capabilities \
            "$BUNDLE_ID_RESOURCE" \
            --capability "Sign In with Apple" \
            || echo "Note: enable-capabilities returned non-zero (likely already enabled)"

          app-store-connect bundle-ids profiles \
            --bundle-ids "$BUNDLE_ID_RESOURCE" \
            --type IOS_APP_STORE \
            --json \
            | jq -r '.[].id' \
            | while read -r PROFILE_ID; do
                [ -z "$PROFILE_ID" ] && continue
                echo "Deleting stale IOS_APP_STORE profile: $PROFILE_ID"
                app-store-connect profiles delete "$PROFILE_ID" --ignore-not-found
              done

          # Free up Distribution certificate slots. We loop the two type
          # filters separately because the CLI's `--type` argument accepts
          # one value at a time for `certificates list`; a cert that
          # somehow appears under both filters is harmless to "double
          # delete" thanks to `--ignore-not-found`.
          for CERT_TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            app-store-connect certificates list \
              --type "$CERT_TYPE" \
              --json \
              | jq -r '.[].id' \
              | while read -r CERT_ID; do
                  [ -z "$CERT_ID" ] && continue
                  echo "Revoking orphan $CERT_TYPE certificate: $CERT_ID"
                  app-store-connect certificates delete "$CERT_ID" --ignore-not-found
                done
          done

      - name: Fetch & install code signing files
        # Pulls (or creates) an Apple Distribution certificate and an App Store
        # provisioning profile for com.salino.sali via the App Store Connect API.
        #
        # The Codemagic CLI needs a local PEM private key to associate the
        # distribution certificate with — without it you get
        # "Cannot save Signing Certificates without certificate private key".
        #
        # NOTE on the `@file:` prefix: current Codemagic CLI versions reject a
        # bare path argument to `--certificate-key`; they treat the value as
        # raw PEM content unless prefixed with `@file:` (read from disk) or
        # `@env:` (read from env var). A bare path errors out with
        # "Provided value '<path>' is not valid".
        #
        # Each run generates a fresh 2048-bit RSA key, which causes a new
        # distribution certificate to be issued in App Store Connect. Apple
        # caps active Distribution certs at 2 per team, but the previous
        # "Refresh App ID, purge stale profiles & orphan distribution
        # certs" step revokes every existing Distribution cert before this
        # runs, so the slot is always free.
        script: |
          set -euxo pipefail
          keychain initialize
          openssl genrsa -out /tmp/certificate_key.pem 2048
          ls -la /tmp/certificate_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/certificate_key.pem \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT" --verbose

      - name: Archive
        script: |
          set -euxo pipefail
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build.xcarchive" \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        script: |
          set -euxo pipefail
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$HOME/export_options.plist"

    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Codemagic handles the App Store Connect upload natively. The build
      # appears on TestFlight ~10–30 minutes after `BUILD SUCCESSFUL`.
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
